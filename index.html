    <script>

          var safari = /Safari/.test(ua) && !/Chrome|Chromium|Edg\/|OPR\/|Android/.test(ua)

          var ios = /iPad|iPhone|iPod|FxiOS|CriOS|EdgiOS/.test(ua) || safari || coarse || (touch && /Macintosh|Mac OS X/.test(ua)) || compact

        } catch (e) {}

    <script>
      document.addEventListener('click', function (event) {
        if (document.documentElement.getAttribute('data-app') === 'ready') return
        var node = event.target
        while (node && node !== document) {
          if (node.tagName === 'A' && node.href) {
            event.preventDefault()
            window.location.href = node.href
            return
          }
          node = node.parentNode
        }
      }, true)
